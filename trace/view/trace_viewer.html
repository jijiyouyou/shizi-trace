<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trace View · MAU / MPL</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #0f1722;
      --header: #141b2d;
      --side: #101826;
      --border: #243044;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #7e3794;
      --tab-idle: #1e3a5f;
      --mod-bar: #163b58;
      --th: #12263a;
      --field: #7dd3fc;
      --hex: #34d399;
      --bits: #f59e0b;
      --addr: #eab308;
      --stat: #fb923c;
      --warn: #e6a23c;
      --err: #e25555;
      --rsv: #64748b;
      --mono: "Cascadia Code", "Consolas", "SF Mono", ui-monospace, monospace;
      --sans: "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 0.85rem 1.25rem 0.7rem;
      background: var(--header);
      border-bottom: 2px solid var(--accent);
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.75rem 1.5rem;
    }
    header h1 { margin: 0; font-size: 1.15rem; font-weight: 600; color: #fff; }
    header .sub { color: var(--muted); font-size: 0.85rem; }
    .tabs { display: flex; gap: 0.3rem; flex-wrap: wrap; }
    .tabs button {
      margin: 0;
      background: var(--tab-idle);
      border: 1px solid transparent;
      color: #93c5fd;
      padding: 0.4rem 0.85rem;
      border-radius: 4px 4px 0 0;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .tabs button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(280px, 340px) 1fr;
      gap: 0;
      flex: 1;
      min-height: 0;
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
    }
    .side, .main {
      padding: 1rem 1.25rem;
      overflow: auto;
    }
    .side { border-right: 1px solid var(--border); background: var(--side); }
    label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin: 0.6rem 0 0.3rem;
    }
    textarea, select, input[type="text"], input[type="search"] {
      width: 100%;
      background: #0b1220;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.8rem;
      padding: 0.5rem 0.65rem;
    }
    textarea { min-height: 140px; resize: vertical; line-height: 1.4; }
    .row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: end; }
    .row > * { flex: 1; min-width: 100px; }
    button.primary, button.secondary {
      margin-top: 0.75rem;
      border: none;
      color: #fff;
      font-weight: 600;
      padding: 0.55rem 1rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button.primary { background: var(--accent); }
    button.secondary { background: #334155; margin-left: 0.35rem; }
    button:hover { filter: brightness(1.06); }
    .status {
      margin-top: 0.75rem;
      font-size: 0.8rem;
      color: var(--muted);
      white-space: pre-wrap;
    }
    .status.err { color: var(--err); }
    .status.warn { color: var(--warn); }
    .nav-tree { margin-top: 1rem; font-size: 0.85rem; }
    .nav-tree details { margin: 0.2rem 0; }
    .nav-tree summary { cursor: pointer; color: var(--muted); }
    .nav-tree button.leaf {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 0.25rem 0.4rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      margin: 0;
    }
    .nav-tree button.leaf:hover, .nav-tree button.leaf.active {
      background: var(--mod-bar);
      color: #fff;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .toolbar input[type="search"] { max-width: 260px; }
    .view-stats {
      margin-left: auto;
      font-size: 0.8rem;
      color: var(--text);
      white-space: nowrap;
    }
    .view-stats .num { color: var(--stat); font-weight: 600; }
    .view-stats .sep { color: var(--muted); margin: 0 0.2rem; }
    input[type="file"] { color: #93c5fd; font-size: 0.8rem; }
    input[type="file"]::file-selector-button {
      background: #fff;
      color: #111827;
      border: none;
      padding: 0.32rem 0.7rem;
      margin-right: 0.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-family: var(--sans);
    }
    .seg > summary .reg-name { font-weight: 700; color: #fff; }
    .seg {
      border: 1px solid #1e3a4c;
      border-radius: 2px;
      margin-bottom: 0.55rem;
      overflow: hidden;
      background: var(--panel);
    }
    .seg > summary {
      padding: 0.45rem 0.75rem;
      background: var(--mod-bar);
      cursor: pointer;
      font-family: var(--mono);
      font-size: 0.84rem;
      color: #fff;
      list-style: none;
    }
    .seg > summary::-webkit-details-marker { display: none; }
    .seg > summary::before { content: "▾ "; color: #fff; }
    .seg:not([open]) > summary::before { content: "▸ "; }
    .seg > summary .c-addr { color: var(--addr); }
    .seg > summary .c-hex { color: var(--hex); }
    .c-meta { color: #93c5fd; font-weight: 400; }
    .seg-body { padding: 0; overflow-x: auto; }
    .seg-body > .seg { border-left: none; border-right: none; border-radius: 0; margin-bottom: 0; }
    table.fields {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 0.78rem;
      font-family: var(--mono);
    }
    table.fields col.c-idx { width: 3.2rem; }
    table.fields col.c-dom { width: 5.2rem; }
    table.fields col.c-raw { width: 7.6rem; }
    table.fields col.c-field { width: 16rem; }
    table.fields col.c-bits { width: 6.2rem; }
    table.fields col.c-w { width: 4.2rem; }
    table.fields col.c-hex { width: 8.2rem; }
    table.fields col.c-dec { width: 6.2rem; }
    table.fields th, table.fields td {
      border-bottom: 1px solid #1b2a3a;
      padding: 0.32rem 0.5rem;
      text-align: left;
      vertical-align: top;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    table.fields.compact-hex {
      table-layout: auto;
      width: auto;
      margin: 0.25rem 0.6rem 0.5rem;
    }
    table.fields.compact-hex th,
    table.fields.compact-hex td {
      padding: 0.1rem 0.2rem;
      font-size: 0.7rem;
      line-height: 1.2;
      border-bottom: none;
      white-space: nowrap;
      letter-spacing: 0;
    }
    table.fields.compact-hex td.c-hex {
      color: var(--hex);
      font-family: var(--mono);
      padding-left: 0.1rem;
      padding-right: 0.1rem;
    }
    table.fields.compact-hdr td.c-hex {
      font-size: 0.9rem;
      padding-left: 0.35rem;
      padding-right: 0.35rem;
    }
    table.fields th {
      color: #cbd5e1;
      font-weight: 500;
      font-family: var(--sans);
      background: var(--th);
      position: sticky;
      top: 0;
    }
    table.fields tbody tr:nth-child(even) { background: #101a26; }
    table.fields .c-idx { color: var(--muted); }
    table.fields .c-dom, table.fields .c-field { color: var(--field); }
    table.fields .c-bits { color: var(--bits); }
    table.fields .c-hex, table.fields .c-raw { color: var(--hex); }
    table.fields .c-dec, table.fields .c-w { color: var(--text); font-variant-numeric: tabular-nums; }
    table.fields .c-desc {
      color: var(--muted);
      font-family: var(--sans);
      white-space: normal;
      overflow: visible;
      text-overflow: unset;
      word-break: break-word;
    }
    table.fields .hex-toggle {
      cursor: pointer;
      border-bottom: 1px dotted rgba(52, 211, 153, 0.45);
    }
    table.fields .hex-toggle:hover { filter: brightness(1.15); }
    table.fields .bin-reveal {
      display: none;
      margin-top: 0.2rem;
      color: #cbd5e1;
      font-size: 0.72rem;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.35;
    }
    table.fields td.bin-show {
      white-space: normal;
      overflow: visible;
    }
    table.fields td.bin-show .bin-reveal { display: block; }
    table.fields tr.rsv td { color: var(--rsv); }
    table.fields tr.rsv .c-field,
    table.fields tr.rsv .c-hex,
    table.fields tr.rsv .c-raw,
    table.fields tr.rsv .c-bits,
    table.fields tr.rsv .c-dom { color: var(--rsv); }
    table.fields tr.rsv .hex-toggle { border-bottom-color: rgba(100, 116, 139, 0.5); }
    table.fields tr.highlight td { background: rgba(126, 55, 148, 0.18); }
    table.fields tr.hidden { display: none; }
    .paw-table { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 0.8rem; margin: 0; }
    .paw-table th, .paw-table td {
      border-bottom: 1px solid #1b2a3a;
      padding: 0.35rem 0.5rem;
      text-align: center;
    }
    .paw-table th { color: #cbd5e1; font-weight: 500; font-family: var(--sans); background: var(--th); }
    .paw-table .paw-name { text-align: left; color: var(--field); white-space: nowrap; }
    .paw-table td { color: var(--hex); }
    .paw-hint { color: var(--muted); font-size: 0.75rem; margin: 0.35rem 0.5rem; }
    table.ctn-pair { table-layout: auto; }
    table.ctn-pair th, table.ctn-pair td { white-space: nowrap; }
    table.ctn-pair .c-idx { color: var(--muted); }
    table.ctn-pair .pair-name { color: var(--field); font-weight: 600; }
    .hex-blob {
      margin: 0;
      border-top: 1px solid #1b2a3a;
      background: #0b1220;
      overflow: hidden;
    }
    .hex-blob-title {
      padding: 0.4rem 0.65rem;
      font-size: 0.78rem;
      color: var(--muted);
      border-bottom: 1px solid #1b2a3a;
      font-family: var(--sans);
      background: var(--th);
    }
    .hex-blob-body {
      margin: 0;
      padding: 0.65rem 0.75rem;
      font-family: var(--mono);
      font-size: 0.8rem;
      line-height: 1.55;
      color: var(--hex);
      white-space: pre-wrap;
      word-break: break-all;
      user-select: text;
    }
    .meta { color: var(--muted); font-size: 0.8rem; margin: 0.4rem 0.65rem 0.5rem; }
    .meta .c-hex { color: var(--hex); }
    .meta .c-addr { color: var(--addr); }
    .stat-line { color: var(--text); font-size: 0.8rem; }
    .stat-line .lbl { color: var(--addr); }
    .stat-line .num { color: var(--stat); }
    .placeholder {
      padding: 2rem;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 8px;
      text-align: center;
    }
    .linkish {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: inherit;
      padding: 0;
      margin: 0;
      text-decoration: underline;
    }
    footer.status-bar {
      border-top: 1px solid var(--border);
      padding: 0.4rem 1.25rem;
      font-size: 0.75rem;
      color: var(--muted);
      background: var(--header);
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Trace View</h1>
      <div class="sub">流水线 dump 字段级解码 · 格式来自 mau_trace.yaml</div>
    </div>
    <nav class="tabs" id="moduleTabs">
      <button type="button" data-mod="mau" class="active">mau</button>
      <button type="button" data-mod="mpl">mpl</button>
      <button type="button" data-mod="iparser">iparser</button>
      <button type="button" data-mod="eparser">eparser</button>
      <button type="button" data-mod="pedt">pedt</button>
    </nav>
  </header>

  <div class="layout">
    <aside class="side">
      <label>粘贴 hex / dump</label>
      <textarea id="pasteArea" placeholder="粘贴 Domain 十六进制，或整段带 ---- xxx start ---- 的日志…"></textarea>

      <label>选择日志文件（仅本地 FileReader）</label>
      <input type="file" id="fileInput" accept=".log,.txt,.dump,.out,*/*" />

      <div>
        <button type="button" class="primary" id="btnParse">解析</button>
        <button type="button" class="secondary" id="btnClear">清空</button>
        <button type="button" class="secondary" id="btnExport">导出 CSV</button>
      </div>
      <div class="status" id="parseStatus"></div>

      <div class="nav-tree" id="navTree"></div>
    </aside>

    <section class="main">
      <div class="toolbar">
        <input type="search" id="fieldFilter" placeholder="Search register or field..." />
        <label style="display:inline-flex;align-items:center;gap:0.35rem;margin:0;color:var(--muted);font-size:0.8rem;">
          <input type="checkbox" id="hideRsv" /> 隐藏保留位
        </label>
        <div class="view-stats" id="viewStats"></div>
      </div>
      <div id="viewRoot">
        <div class="placeholder">粘贴 hex 或选择日志文件后点击「解析」</div>
      </div>
    </section>
  </div>

  <footer class="status-bar" id="statusBar">就绪 · 格式表已嵌入</footer>

  function parseU32Tokens(text) {
    if (!text || !String(text).trim()) throw new Error("空输入");

    if (hi < lo) throw new Error("bits 应为 [hi, lo] 且 hi>=lo（bit0=LSB），收到 [" + hi + ", " + lo + "]");

    if (typeof val === "bigint") bin = width <= 64 ? ("0b" + val.toString(2).padStart(width, "0")) : ("0b…(" + width + "bit)");

      throw new Error(name + ": width=" + fd.width + " 与 bits[" + hi + ":" + lo + "] 宽度 " + width + " 不一致");
    }
    let val = 0;
    const srcParts = [];
    const domains = [];
    pieces.forEach((p) => {
      const d = p.domain | 0;
      const pb = parseBitsHiLo(p.bits);
      if (!p.into || p.into.length !== 2) throw new Error(name + ": piece D" + d + " 缺少 into");
      const ihi = p.into[0] | 0, ilo = p.into[1] | 0;
      if (ihi < ilo || ilo < 0) throw new Error(name + ": 非法 into [" + ihi + ":" + ilo + "]");
      if (ihi - ilo + 1 !== pb.width) {
        throw new Error(name + ": D" + d + "[" + pb.hi + ":" + pb.lo + "] 宽与 into 不一致");
      }
      if (d < 0 || d >= words.length) throw new Error(name + ": D" + d + " 越界");
      const piece = extractBits(words[d], pb.hi, pb.lo);

      srcParts.push("D" + d + "[" + pb.hi + ":" + pb.lo + "]→[" + ihi + ":" + ilo + "]");

    domains.forEach((d) => { if (seen.indexOf(d) < 0) seen.push(d); });

      bits: "[" + hi + ":" + lo + "] (" + srcParts.join("+") + ")",

  function decodeTrace(words, layout, allowShort) {
