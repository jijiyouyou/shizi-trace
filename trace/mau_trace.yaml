# MAU trace 十六进制 dump 解析格式
# 来源：tools/trace/view/mau/trace-格式/*.jpg（文字转录）
# Domain Dn = 第 n 个 u32（一字一 Domain）
#
# bits 约定（必须严格按位解析，禁止按字段顺序“凑宽”）：
#   bits: [hi, lo]  与 Verilog [hi:lo] 相同（hi >= lo）
#   一字内 bit0 = 最低位（LSB），bit31 = 最高位（MSB）
#   例：bypass_mau bits: [0, 0] → 取 u32 的 bit0
#       hit_idx    bits: [4, 1] → 取 bit[4:1]（不是 [1:4] 写法颠倒）
#   width 应等于 hi-lo+1；解码以 bits 为准，width 仅作展示/校验
#
# 与 md 中 count 对齐：cls=18, keygen=29, vme=52(lama26+lamb26), lrr=26, egr=54

word_bits: 32
bit_order: lsb0_in_word

# payloads：跨 Domain 拼出的逻辑总线内部字段（bit 相对该总线 LSB=0）
payloads:

  # 来源：view/trace-格式/mpl.jpg + keygen 图注
  # mau_mpl_req_data 共 373bit：[371:0]=接口 372bit 业务字段，[372]=pptrace(ppt)
  # Domain 拼包：D0[31:2]→[29:0]，…，D11[22:0]→[372:350]（含 ppt）
  mau_mpl_req_data:
    width: 373
    bit_order: lsb0
    note: "keygen_trace name=mau_mpl_req_data 拼出的向量；0..371 同 mpl 接口，372=pptrace"
    fields:
      - { name: lu_key_prof, bits: [3, 0], width: 4, desc: "查询 prof" }
      - { name: lu0_enable, bits: [4, 4], width: 1, desc: "图中 lu0_enbale" }
      - { name: lu1_enable, bits: [5, 5], width: 1, desc: "lu1_enable" }
      - { name: lu_key, bits: [325, 6], width: 320, words_rev: true, desc: "查找 key（10×u32 展示高字在前）" }
      - { name: sf_read0, bits: [326, 326], width: 1, desc: "读使能0", highlight: enable }
      - { name: sf_read_prof0, bits: [328, 327], width: 2, desc: "sf_read_prof0" }
      - { name: sf_read1, bits: [329, 329], width: 1, desc: "读使能1", highlight: enable }
      - { name: sf_read_prof1, bits: [331, 330], width: 2, desc: "sf_read_prof1" }
      - { name: sf_read_idx0, bits: [351, 332], width: 20, desc: "读索引0" }
      - { name: sf_read_idx1, bits: [371, 352], width: 20, desc: "读索引1（业务最高位 [371]）" }
      - { name: pptrace, bits: [372, 372], width: 1, desc: "ppt / pptrace；keygen Domain 最高 1bit" }

  mau_mpl_rsp_data:
    width: 298
    bit_order: lsb0
    note: "对lrr_trace中的Lur进行解析"
    fields:
      - { name: res_vld, bits: [3, 0], width: 4, desc: "查询有效位" }
      - { name: hit, bits: [5, 4], width: 2, desc: "2查hit位" }
      - { name: hit_idx, bits: [37, 6], width: 32, desc: "hit idx" }
      - { name: val, bits: [293, 38], width: 256, desc: "mpl rsp" }
      - { name: hw_err, bits: [297, 294], width: 4, desc: "hw err" }

  lpm_mpl_req_data:
    width: 272
    bit_order: lsb0
    assemble_msb: true
    note: "272bit = 16bit hdr + 8×u32；hdr=lu_sip_vld/lu_dip_vld/is_ipv6/vrf  从keygen_trace中的domain12开始"
    fields:
      - { name: lu_sip_vld, bits: [0, 0], width: 1, desc: "sip lpm 查询" }
      - { name: lu_dip_vld, bits: [1, 1], width: 1, desc: "dip lpm 查询" }
      - { name: is_ipv6, bits: [2, 2], width: 1, desc: "是否为ipv6" }
      - { name: vrf, bits: [15, 3], width: 13, desc: "vrf" }
      - { name: sip, bits: [143, 16], width: 128, words_rev: true, desc: "sip（4×u32 高字在前）" }
      - { name: dip, bits: [271, 144], width: 128, words_rev: true, desc: "dip（4×u32 高字在前）" }

  lpm_mpl_rsp_data:
    width: 76
    bit_order: lsb0
    note: "对egr_trace中的lpm_result进行解析"
    fields:
      - { name: sip_dft_tote_set, bits: [75, 75], width: 1, desc: "sip dft" }
      - { name: dip_dft_rote_set, bits: [74, 74], width: 1, desc: "dip dft" }
      - { name: sip_rsp_vld, bits: [73, 73], width: 1, desc: "sip rsp vld" }
      - { name: dip_rsp_vld, bits: [72, 72], width: 1, desc: "dip rsp vld" }
      - { name: sip_hit, bits: [71, 70], width: 2, desc: "b00:miss. b01:hit. b1x:hardware error" }
      - { name: dip_hit, bits: [69, 68], width: 2, desc: "b00:miss. b01:hit. b1x:hardware error" }
      - { name: sip_hit_idx, bits: [67, 52], width: 16, desc: "lookup hit index, meaningful when response is valid and hit" }
      - { name: dip_hit_idx, bits: [51, 36], width: 16, desc: "lookup hit index, meaningful when response is valid and hit" }
      - { name: sip_val_idx, bits: [35, 18], width: 18, desc: "sip value index" }
      - { name: dip_val_idx, bits: [17, 0], width: 18, desc: "dip value index" }


traces:

  cls_trace:
    title: Cls trace
    word_count: 18   # D0..D17
    fields:
      - { domain: 0, name: bypass_mau, bits: [0, 0], width: 1, desc: "cls 未命中或 MAU 不使能" }
      - { domain: 0, name: hit_idx, bits: [4, 1], width: 4, desc: "流分类 clsd 命中索引" }
      - { domain: 0, name: cls_key, bits: [20, 5], width: 16, desc: "流分类 key" }
      - { domain: 0, name: rd_keg_prof1, bits: [22, 21], width: 2, desc: "Direct read1 提取 prof" }
      - { domain: 0, name: rd_keg_prof0, bits: [24, 23], width: 2, desc: "Direct read0 提取 prof" }
      - { domain: 0, name: lkp_keg_prof, bits: [28, 25], width: 4, desc: "Lu key gen prof" }
      # 跨 D0/D1：合成 4bit vme_keg_prof；into 为合成值内 [hi:lo]
      - name: vme_keg_prof
        width: 4
        bits: [3, 0]
        desc: "Vme keygen prof[3:0]"
        pieces:
          - { domain: 0, bits: [31, 29], into: [2, 0] }   # D0[31:29] → prof[2:0]
          - { domain: 1, bits: [0, 0], into: [3, 3] }     # D1[0] → prof[3]
      - { domain: 1, name: glb_ctl_prof, bits: [4, 1], width: 4, desc: "Global ctrl prof" }
      - { domain: 1, name: igr_port, bits: [9, 5], width: 5, desc: "入口 port（图中 igr_porf）" }
      - { domain: 1, name: rsv, bits: [31, 10], width: 22, desc: "保留" }
      # D2..D17：512bit igr_psv；Dn → psv[(n-2)*32+31:(n-2)*32]
      - { domain: 2, name: igr_psv, bits: [31, 0], width: 32, desc: "igr_psv[31:0]" }
      - { domain: 3, name: igr_psv, bits: [31, 0], width: 32, desc: "igr_psv[63:32]" }
      - { domain: 4, name: igr_psv, bits: [31, 0], width: 32, desc: "igr_psv[95:64]" }
      - { domain: 5, name: igr_psv, bits: [31, 0], width: 32, desc: "igr_psv[127:96]" }
      - { domain: 6, name: igr_psv, bits: [31, 0], width: 32, desc: "igr_psv[159:128]" }
      - { domain: 7, name: igr_psv, bits: [31, 0], width: 32, desc: "igr_psv[191:160]" }
      - { domain: 8, name: igr_psv, bits: [31, 0], width: 32, desc: "igr_psv[223:192]" }
      - { domain: 9, name: igr_psv, bits: [31, 0], width: 32, desc: "igr_psv[255:224]" }
      - { domain: 10, name: igr_psv, bits: [31, 0], width: 32, desc: "igr_psv[287:256]" }
      - { domain: 11, name: igr_psv, bits: [31, 0], width: 32, desc: "igr_psv[319:288]" }
      - { domain: 12, name: igr_psv, bits: [31, 0], width: 32, desc: "igr_psv[351:320]" }
      - { domain: 13, name: igr_psv, bits: [31, 0], width: 32, desc: "igr_psv[383:352]" }
      - { domain: 14, name: igr_psv, bits: [31, 0], width: 32, desc: "igr_psv[415:384]" }
      - { domain: 15, name: igr_psv, bits: [31, 0], width: 32, desc: "igr_psv[447:416]" }
      - { domain: 16, name: igr_psv, bits: [31, 0], width: 32, desc: "igr_psv[479:448]" }
      - { domain: 17, name: igr_psv, bits: [31, 0], width: 32, desc: "igr_psv[511:480]" }

  keygen_trace:
    title: keygen trace
    word_count: 29   # D0..D28
    fields:
      - { domain: 0, name: mpl_req, bits: [0, 0], width: 1, desc: "mau 查询 mpl 有效指示" }
      - { domain: 0, name: lpm_req, bits: [1, 1], width: 1, desc: "mau 查询 lpm 有效指示" }
      - { domain: 0, name: mau_mpl_req_data, bits: [31, 2], width: 30, desc: "拼入 payloads.mau_mpl_req_data[29:0]" }
      - { domain: 1, name: mau_mpl_req_data, bits: [31, 0], width: 32, desc: "拼入 [61:30]" }
      - { domain: 2, name: mau_mpl_req_data, bits: [31, 0], width: 32, desc: "拼入 [93:62]" }
      - { domain: 3, name: mau_mpl_req_data, bits: [31, 0], width: 32, desc: "拼入 [125:94]" }
      - { domain: 4, name: mau_mpl_req_data, bits: [31, 0], width: 32, desc: "拼入 [157:126]" }
      - { domain: 5, name: mau_mpl_req_data, bits: [31, 0], width: 32, desc: "拼入 [189:158]" }
      - { domain: 6, name: mau_mpl_req_data, bits: [31, 0], width: 32, desc: "拼入 [221:190]" }
      - { domain: 7, name: mau_mpl_req_data, bits: [31, 0], width: 32, desc: "拼入 [253:222]" }
      - { domain: 8, name: mau_mpl_req_data, bits: [31, 0], width: 32, desc: "拼入 [285:254]" }
      - { domain: 9, name: mau_mpl_req_data, bits: [31, 0], width: 32, desc: "拼入 [317:286]" }
      - { domain: 10, name: mau_mpl_req_data, bits: [31, 0], width: 32, desc: "拼入 [349:318]" }
      - { domain: 11, name: rsv, bits: [31, 24], width: 8, desc: "保留" }
      - { domain: 11, name: pass_through_psv, bits: [23, 23], width: 1, desc: "透传 psv 指示" }
      - { domain: 11, name: mau_mpl_req_data, bits: [22, 0], width: 23, desc: "拼入 [372:350]；其中 [372]=pptrace" }
      - { domain: 12, name: mau_lpm_req_data, bits: [31, 0], width: 32, desc: "lpm u32[0] → payloads.lpm_mpl_req_data（16bit+8×u32）" }
      - { domain: 13, name: mau_lpm_req_data, bits: [31, 0], width: 32, desc: "lpm u32[1]" }
      - { domain: 14, name: mau_lpm_req_data, bits: [31, 0], width: 32, desc: "lpm u32[2]" }
      - { domain: 15, name: mau_lpm_req_data, bits: [31, 0], width: 32, desc: "lpm u32[3]" }
      - { domain: 16, name: mau_lpm_req_data, bits: [31, 0], width: 32, desc: "lpm u32[4]" }
      - { domain: 17, name: mau_lpm_req_data, bits: [31, 0], width: 32, desc: "lpm u32[5]" }
      - { domain: 18, name: mau_lpm_req_data, bits: [31, 0], width: 32, desc: "lpm u32[6]" }
      - { domain: 19, name: mau_lpm_req_data, bits: [31, 0], width: 32, desc: "lpm u32[7]" }
      - { domain: 20, name: mau_lpm_req_data, bits: [15, 0], width: 16, desc: "lpm 低 16bit（与上 8×u32 共 272bit）" }
      - { domain: 20, name: pass_through_psv, bits: [18, 18], width: 1, desc: "透传 PSV 指示" }
      - { domain: 20, name: rsv, bits: [31, 19], width: 13, desc: "保留" }
      - { domain: 21, name: paw, bits: [31, 0], width: 32, desc: "paw[31:0]" }
      - { domain: 22, name: paw, bits: [31, 0], width: 32, desc: "paw[63:32]" }
      - { domain: 23, name: paw, bits: [31, 0], width: 32, desc: "paw[95:64]" }
      - { domain: 24, name: paw, bits: [31, 0], width: 32, desc: "paw[127:96]" }
      - { domain: 25, name: paw, bits: [31, 0], width: 32, desc: "paw[159:128]" }
      - { domain: 26, name: paw, bits: [31, 0], width: 32, desc: "paw[191:160]" }
      - { domain: 27, name: paw, bits: [31, 0], width: 32, desc: "paw[223:192]" }
      - { domain: 28, name: paw, bits: [31, 0], width: 32, desc: "paw[255:224]" }

  # vme_trace：lama(D0..D25) + lamb(D26..D51) = 52 word；VME1~4 同构
  vme_lama_trace:
    title: VME0 lama trace
    word_count: 26
    domain_base: 0
    fields:
      - { domain: 0, name: aval, bits: [31, 0], width: 32, byte_rev: u8x4, desc: "i_aval（显示按 4×u8 反序）" }
      - { domain: 1, name: bval, bits: [31, 0], width: 32, byte_rev: u8x4, desc: "i_bval（显示按 4×u8 反序）" }
      - { domain: 2, name: mux_sel, bits: [7, 0], width: 8, desc: "{mux_sel[0..3]}" }
      - { domain: 2, name: lam_idx, bits: [10, 8], width: 3, desc: "Lam_idx" }
      - { domain: 2, name: rsv, bits: [11, 11], width: 1, desc: "Rsv" }
      - { domain: 2, name: luta_idx, bits: [13, 12], width: 2, desc: "Luta_idx" }
      - { domain: 2, name: Lut_rlt, bits: [14, 14], width: 1, desc: "1bit Lut 查找结果" }
      - { domain: 2, name: rsv, bits: [15, 15], width: 1, desc: "Rsv" }
