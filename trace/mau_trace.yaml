      - { domain: 3, name: yval_vld, bits: [19, 16], width: 4, desc: "{vld[0..3]} 忽略, RTL未设置" }
      - { domain: 3, name: yval3, bits: [27, 20], width: 8, desc: "yval[3]；有效性看 yval_btot[3]，为0无效" }
      - { domain: 3, name: yval2_lo, bits: [31, 28], width: 4, desc: "yval[2][3:0]；有效性看 yval_btot[2]，为0无效" }
