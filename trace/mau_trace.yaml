# ---------------------------------------------------------------------------
# statistics：统计 / 调试 / 控制寄存器（与 traces dump 独立）
# 来源：tools/trace/格式/*.jpg（文字转录）；不改动上方 traces 与 offset 约定
# 字段 bits [hi, lo] 相对本寄存器 u32，LSB=bit0
# ---------------------------------------------------------------------------
statistics:

  # --- 抓取使能与 PSV 偏移 ---
  trace_ctrl:
    title: Trace 使能与抓取控制
    registers:

      ppt_mode:
        offset: 0x1300
        width: 32
        reset: 0
        fields:
          - { name: rsv, bits: [31, 3], width: 29, access: ro, desc: "保留" }
          - { name: mode, bits: [2, 0], width: 3, access: rw, type: cfg, reset: 0x1, desc: "pp trace mode：0=不使能；1/2=抓有ppt标识；3=抓进入的第一包；4=抓进入的最新包；其它=不使能" }

      mau_trace_crs:
        offset: 0x1304
        width: 32
        reset: 0
        fields:
          - { name: rsv, bits: [31, 15], width: 17, access: ro, desc: "保留" }
          - { name: local_engine_trace_vld, bits: [14, 14], width: 1, access: ro, type: sts, desc: "local engine 抓取信息有效" }
          - { name: lpm_trace_vld, bits: [13, 13], width: 1, access: ro, type: sts, desc: "lpm 抓取信息有效" }
          - { name: egr_psv_trace_vld, bits: [12, 12], width: 1, access: ro, type: sts, desc: "egr_psv 抓取信息有效" }
          - { name: llr_trace_vld, bits: [11, 11], width: 1, access: ro, type: sts, desc: "llr/lrr 抓取信息有效" }
          - { name: vme_trace_vld, bits: [10, 10], width: 1, access: ro, type: sts, desc: "vme0-4 抓取信息有效" }
          - { name: keygen_trace_vld, bits: [9, 9], width: 1, access: ro, type: sts, desc: "keygen 抓取信息有效" }
          - { name: cls_trace_vld, bits: [8, 8], width: 1, access: ro, type: sts, desc: "cls 抓取信息有效" }
          - { name: egr_psv_512bit_ofs_2, bits: [7, 6], width: 2, access: rw, type: cfg, reset: 0x2, desc: "出口PSV 512bit 片选：0=[1535:1024]；1=[1023:512]；2=[511:0]；其它等同0" }
          - { name: egr_psv_512bit_ofs_1, bits: [5, 4], width: 2, access: rw, type: cfg, reset: 0x1, desc: "出口PSV 512bit 片选（同上）" }
          - { name: egr_psv_512bit_ofs_0, bits: [3, 2], width: 2, access: rw, type: cfg, reset: 0x0, desc: "出口PSV 512bit 片选（同上）" }
          - { name: igr_psv_512bit_ofs, bits: [1, 0], width: 2, access: rw, type: cfg, reset: 0x0, desc: "入口PSV 512bit 片选：0=[1535:1024]；1=[1023:512]；2=[511:0]；其它等同0" }

  # --- 其它配置 ---
  other_cfg:
    title: 其它配置
    registers:

      local_engine_val:
        offset: 0x12c0
        width: 32
        fields:
          - { name: rsv, bits: [31, 22], width: 10, access: ro, desc: "保留" }
          - { name: cfg_nhop_width, bits: [21, 17], width: 5, access: rw, type: cfg, reset: 0x12, desc: "nhop 宽度" }
          - { name: cfg_dip_nhop_width, bits: [16, 12], width: 5, access: rw, type: cfg, reset: 0x12, desc: "dip nhop 宽度" }
          - { name: cfg_sip_nhop_width, bits: [11, 7], width: 5, access: rw, type: cfg, reset: 0x12, desc: "sip nhop 宽度" }
          - { name: cfg_lpm_en, bits: [6, 6], width: 1, access: rw, type: cfg, desc: "lpm 使能" }
          - { name: cfg_vlan_filter_en, bits: [5, 5], width: 1, access: rw, type: cfg, desc: "vlan filter 使能" }
          - { name: cfg_stp_filter_en, bits: [4, 4], width: 1, access: rw, type: cfg, desc: "stp filter 使能" }
          - { name: cfg_l4_port_rng_en, bits: [3, 3], width: 1, access: rw, type: cfg, desc: "l4 port range 使能" }
          - { name: cfg_copp_en, bits: [2, 2], width: 1, access: rw, type: cfg, desc: "copp 使能" }
          - { name: cfg_ecmp_en, bits: [1, 1], width: 1, access: rw, type: cfg, desc: "ecmp 使能" }
          - { name: cfg_hash_en, bits: [0, 0], width: 1, access: rw, type: cfg, desc: "hash 使能" }

      endianness_adjust:
        offset: 0x12c4
        width: 32
        fields:
          - { name: rsv, bits: [31, 4], width: 28, access: ro, desc: "保留" }
          - { name: ingress_u32_revert, bits: [3, 3], width: 1, access: rw, type: cfg, desc: "入口 u32 字节序翻转" }
          - { name: ingress_u1_revert, bits: [2, 2], width: 1, access: rw, type: cfg, desc: "入口 u1 翻转" }
          - { name: egress_u32_revert, bits: [1, 1], width: 1, access: rw, type: cfg, desc: "出口 u32 字节序翻转" }
          - { name: egress_u1_revert, bits: [0, 0], width: 1, access: rw, type: cfg, desc: "出口 u1 翻转" }

  # --- 指令/表项配置 ---
  cfg_inst:
    title: MAU / Keygen 指令配置
    note: "block b_mau；基址相对 0x0"
    registers:

      mau_ts:
        offset: 0x0
        width: 32
        fields:
          - { name: ts, bits: [31, 0], width: 32, desc: "timestamp" }

      mau_cfg_inst0_0:
        offset: 0x4
        width: 32
        fields:
          - { name: rsv, bits: [31, 1], width: 31, desc: "保留" }
          - { name: proc_en, bits: [0, 0], width: 1, desc: "process enable" }

      mau_cfg_inst0_1:
        offset: 0x8
        width: 32
        fields:
          - { name: reg_cfg_0, bits: [31, 0], width: 32, desc: "cfg word0" }

      mau_cfg_inst0_2:
        offset: 0xc
        width: 32
        fields:
          - { name: reg_cfg_1, bits: [31, 0], width: 32, desc: "cfg word1" }

      mau_cfg_inst0_3:
        offset: 0x10
        width: 32
        fields:
          - { name: reg_cfg_2, bits: [31, 0], width: 32, desc: "cfg word2" }

      mau_cfg_inst0_4:
        offset: 0x14
        width: 32
        fields:
          - { name: reg_cfg_3, bits: [31, 0], width: 32, desc: "cfg word3" }

      mau_cfg_inst0_5:
        offset: 0x18
        width: 32
        fields:
          - { name: reg_cfg_4, bits: [31, 0], width: 32, desc: "cfg word4" }

      mau_cfg_inst0_6:
        offset: 0x1c
        width: 32
        fields:
          - { name: reg_cfg_5, bits: [31, 0], width: 32, desc: "cfg word5" }

      mau_cfg_inst0_7:
        offset: 0x20
        width: 32
        fields:
          - { name: reg_cfg_6, bits: [31, 0], width: 32, desc: "cfg word6" }

      mau_cfg_inst0_8:
        offset: 0x24
        width: 32
        fields:
          - { name: reg_cfg_7, bits: [31, 0], width: 32, desc: "cfg word7" }



  # --- 初始化 / IACRA ---
  fw_init:
    title: FW 初始化与 IACRA
    registers:

      fw_mau_init_start:
        offset: 0x6e4
        width: 32
        desc: "initial FD filter"
        fields:
          - { name: reserved, bits: [31, 1], width: 31, desc: "保留" }
          - { name: init_start, bits: [0, 0], width: 1, desc: "发起初始化" }

      fw_mau_init_done:
        offset: 0x6e8
        width: 32
        desc: "initial status of FD filter"
        fields:
          - { name: reserved, bits: [31, 1], width: 31, desc: "保留" }
          - { name: init_done, bits: [0, 0], width: 1, desc: "初始化完成" }


  # --- ECC / 中断 ---
  fw_ecc:
    title: FW ECC 与中断
    registers:

      fw_insert_ecc_err:
        offset: 0xd14
        width: 32
        desc: "force ecc error by software"
        fields:
          - { name: err_2bit, bits: [31, 31], width: 1, access: rw1s, type: upd, desc: "注入 2bit ecc 错" }
          - { name: err_1bit, bits: [30, 30], width: 1, access: rw1s, type: upd, desc: "注入 1bit ecc 错" }
          - { name: rsv, bits: [29, 16], width: 14, access: ro, desc: "保留" }
          - { name: u8_idx_0, bits: [15, 12], width: 4, access: rw, type: cfg, desc: "u8 index0" }
          - { name: u8_idx_1, bits: [11, 8], width: 4, access: rw, type: cfg, desc: "u8 index1" }
          - { name: u8_idx_2, bits: [7, 4], width: 4, access: rw, type: cfg, desc: "u8 index2" }
          - { name: u8_idx_3, bits: [3, 0], width: 4, access: rw, type: cfg, desc: "u8 index3" }

      fw_dbg_ecc_cnt:
        offset: 0xd18
        width: 32
        desc: "ecc error cnt"
        fields:
          - { name: rsv, bits: [31, 16], width: 16, access: ro, desc: "保留" }
          - { name: cnt2, bits: [15, 8], width: 8, access: rc, type: scnt, desc: "2bit ecc 计数" }
          - { name: cnt1, bits: [7, 0], width: 8, access: rc, type: scnt, desc: "1bit ecc 计数" }

      fw_int_en:
        offset: 0xd1c
        width: 32
        desc: "ecc interrupt enable"
        fields:
          - { name: rsv, bits: [31, 3], width: 29, desc: "保留" }
          - { name: fifo_overflow, bits: [2, 2], width: 1, access: rw, type: cfg, desc: "fifo overflow 中断使能" }
          - { name: ecc_1bit_en, bits: [1, 1], width: 1, access: rw, type: cfg, desc: "1bit ecc 中断使能" }
          - { name: ecc_2bit_en, bits: [0, 0], width: 1, access: rw, type: cfg, desc: "2bit ecc 中断使能" }

      fw_int_set:
        offset: 0xd20
        width: 32
        desc: "set ecc interrupt"
        fields:
          - { name: rsv, bits: [31, 3], width: 29, desc: "保留" }
          - { name: fifo_overflow, bits: [2, 2], width: 1, access: rw1s, type: upd, desc: "置位 fifo overflow" }
          - { name: ecc_1bit_en, bits: [1, 1], width: 1, access: rw1s, type: upd, desc: "置位 1bit ecc" }
          - { name: ecc_2bit_en, bits: [0, 0], width: 1, access: rw1s, type: upd, desc: "置位 2bit ecc" }

      fw_int_clr:
        offset: 0xd24
        width: 32
        desc: "clear ecc interrupt"
        fields:
          - { name: rsv, bits: [31, 3], width: 29, desc: "保留" }
          - { name: fifo_overflow, bits: [2, 2], width: 1, access: rw1c, type: upd, desc: "清 fifo overflow" }
          - { name: ecc_1bit_en, bits: [1, 1], width: 1, access: rw1c, type: upd, desc: "清 1bit ecc" }
          - { name: ecc_2bit_en, bits: [0, 0], width: 1, access: rw1c, type: upd, desc: "清 2bit ecc" }

      fw_int_sts:
        offset: 0xd28
        width: 32
        desc: "ecc error interrupt status"
        fields:
          - { name: rsv, bits: [31, 3], width: 29, desc: "保留" }
          - { name: fifo_overflow, bits: [2, 2], width: 1, access: ro, type: sts, desc: "fifo overflow 状态" }
          - { name: ecc_1bit_en, bits: [1, 1], width: 1, access: ro, type: sts, desc: "1bit ecc 状态" }
          - { name: ecc_2bit_en, bits: [0, 0], width: 1, access: ro, type: sts, desc: "2bit ecc 状态" }

      fw_int_ecc_info:
        offset: 0xd2c
        width: 32
        desc: "ecc error interrupt info"
        fields:
          - { name: rsv, bits: [31, 26], width: 6, desc: "保留" }
          - { name: ecc_error_flg, bits: [25, 24], width: 2, access: ro, type: sts, desc: "ecc error flag" }
          - { name: mem_addr_2bit, bits: [23, 16], width: 8, access: ro, type: sts, desc: "2bit 错 mem 地址" }
          - { name: mem_id_2bit, bits: [15, 12], width: 4, access: ro, type: sts, desc: "2bit 错 mem id" }
          - { name: mem_addr_1bit, bits: [11, 4], width: 8, access: ro, type: sts, desc: "1bit 错 mem 地址" }
          - { name: mem_id_1bit, bits: [3, 0], width: 4, access: ro, type: sts, desc: "1bit 错 mem id" }

  # --- FIFO 状态 / 调试计数 / 统计控制 / credit ---
  fw_dbg:
    title: FW 调试计数与 Credit
    registers:

      fw_fifo_sts:
        offset: 0xd30
        width: 32
        count: 11
        step: 0x4
        desc: "fifo status（数组 0..10）"
        fields:
          - { name: reserved, bits: [31, 16], width: 16, desc: "保留" }
          - { name: over_drop, bits: [15, 12], width: 4, access: rc, type: scnt, desc: "over drop 计数" }
          - { name: real_empty, bits: [11, 11], width: 1, access: ro, type: sts, reset: 0x1, desc: "real empty" }
          - { name: almost_empty, bits: [10, 10], width: 1, access: ro, type: sts, desc: "almost empty" }
          - { name: real_full, bits: [9, 9], width: 1, access: ro, type: sts, desc: "real full" }
          - { name: almost_full, bits: [8, 8], width: 1, access: ro, type: sts, desc: "almost full" }
          - { name: fifo_cnt, bits: [7, 0], width: 8, access: ro, type: sts, desc: "fifo 深度计数" }

      fw_dbg_cnt:
        offset: 0xd5c
        width: 32
        count: 14
        step: 0x4
        desc: "debug counter（数组 0..13，每项 1×u32）"
        items:
          - { name: igr_pkt, desc: "入口报文数目" }
          - { name: egr_pkt, desc: "出口报文数目" }
          - { name: mpl_lookup, desc: "查询MPL数目" }
          - { name: mpl_return, desc: "MPL返回数目" }
          - { name: lpm_lookup, desc: "查询LPM数目" }
          - { name: lpm_return, desc: "LPM返回数目" }
          - { name: mpl_hit0, desc: "mpl hit[0] 数目" }
          - { name: mpl_hit1, desc: "mpl hit[1] 数目" }
          - { name: lpm_hit1, desc: "lpm hit[1] 数目" }
          - { name: lpm_hit0, desc: "lpm hit[0] 数目" }
          - { name: bypass_cls_miss_mau, desc: "bypass/cls-miss mau 数目" }
          - { name: bypass_mpl, desc: "bypass mpl 数目" }
          - { name: bypass_lpm, desc: "bypass lpm 数目" }
          - { name: cls_hit, desc: "cls hit数目" }
        fields:
          - { name: cnt, bits: [31, 0], width: 32, type: sts, desc: "计数" }

      fw_stistics_ctl:
        offset: 0xd94
        width: 32
        desc: "statistics control（寄存器名按表：fw_stistics_ctl）"
        fields:
          - { name: rsv, bits: [31, 2], width: 30, desc: "保留" }
          - { name: sw_rc_en, bits: [1, 1], width: 1, access: rw, type: cfg, desc: "软件读清使能" }
          - { name: en, bits: [0, 0], width: 1, access: rw, type: cfg, desc: "统计使能" }

      fw_dbg_credit:
        offset: 0xd9c
        width: 32
        fields:
          - { name: egr_credit_cnt, bits: [31, 28], width: 4, type: sts, desc: "egr credit" }
          - { name: mid_credit_cnt, bits: [27, 24], width: 4, type: sts, desc: "mid credit" }
          - { name: lpa_credit_cnt, bits: [23, 18], width: 6, type: sts, desc: "lpa credit" }
          - { name: igr_credit_cnt2, bits: [17, 12], width: 6, type: sts, desc: "igr credit2" }
          - { name: igr_credit_cnt1, bits: [11, 6], width: 6, type: sts, desc: "igr credit1" }
          - { name: igr_credit_cnt0, bits: [5, 0], width: 6, type: sts, desc: "igr credit0" }

  # --- 反压统计 ---
  bp_stat:
    title: 反压（BP）统计
    registers:

      fw_dbg_bp_his:
        offset: 0x191c
        width: 32
        desc: "bp history"
        fields:
          - { name: rsv, bits: [31, 5], width: 27, desc: "保留" }
          - { name: localeng_ppu_bp, bits: [4, 4], width: 1, type: sts, desc: "本地 ENGINE 反压历史" }
          - { name: lpm_ppu_bp, bits: [3, 3], width: 1, type: sts, desc: "LPM 反压历史" }
          - { name: next_ppu_bp, bits: [2, 2], width: 1, type: sts, desc: "后级反压历史" }
          - { name: mpl_ppu_bp, bits: [1, 1], width: 1, type: sts, desc: "MPL 反压历史" }
          - { name: pre_ppu_bp, bits: [0, 0], width: 1, type: sts, desc: "前级/本级反压历史" }

      fw_dbg_bp_cur:
        offset: 0x1920
        width: 32
        desc: "bp current"
        fields:
          - { name: rsv, bits: [31, 5], width: 27, desc: "保留" }
          - { name: localeng_ppu_bp, bits: [4, 4], width: 1, type: sts, desc: "本地 ENGINE 当前反压" }
          - { name: lpm_ppu_bp, bits: [3, 3], width: 1, type: sts, desc: "LPM 当前反压" }
          - { name: next_ppu_bp, bits: [2, 2], width: 1, type: sts, desc: "后级当前反压" }
          - { name: mpl_ppu_bp, bits: [1, 1], width: 1, type: sts, desc: "MPL 当前反压" }
          - { name: pre_ppu_bp, bits: [0, 0], width: 1, type: sts, desc: "前级/本级当前反压" }

      fw_dbg_bp_max_cnt:
        offset: 0x1924
        width: 32
        count: 5
        step: 0x4
        desc: "历史最长反压 cycle 数；[0]本级MAU [1]mpl [2]后级 [3]LPM [4]本地ENGINE"
        fields:
          - { name: rsv, bits: [31, 24], width: 8, desc: "保留" }
          - { name: bp_max_cnt, bits: [23, 0], width: 24, type: sts, desc: "最长反压 cycle" }

      fw_dbg_bp_max_cnt_clr:
        offset: 0x1938
        width: 32
        fields:
          - { name: rsv, bits: [31, 5], width: 27, desc: "保留" }
          - { name: bp_max_cnt_clr, bits: [4, 0], width: 5, access: rw, type: cfg, desc: "清最长反压记录；bit[0..4] 对应本级/mpl/后级/LPM/本地ENGINE" }

      fw_dbg_bp_avg_prd:
        offset: 0x193c
        width: 32
        count: 5
        step: 0x4
        desc: "平均时长统计周期；[0]本级MAU反压本级 [1]apl反压本级 [2]后级MAU/pedt/ipp_ots [3]LPM反压本级 [4]本地ENGINE"
        fields:
          - { name: rsv, bits: [31, 17], width: 15, desc: "保留" }
          - { name: bp_avg_prd_vld, bits: [16, 16], width: 1, type: sts, desc: "平均周期有效" }
          - { name: bp_avg_prd, bits: [15, 0], width: 16, access: rw, type: cfg, desc: "平均时长统计周期" }

      fw_dbg_bp_avg_cnt:
        offset: 0x1950
        width: 32
        count: 5
        step: 0x4
        desc: "平均周期内反压 cycle 计数（与 bp_avg_prd 同序）"
        fields:
          - { name: rsv, bits: [31, 16], width: 16, access: ro, desc: "保留" }
          - { name: bp_avg_cnt, bits: [15, 0], width: 16, access: ro, type: sts, desc: "平均时长统计周期内反压 cycle" }

      fw_dbg_bp_set:
        offset: 0x1964
        width: 32
        fields:
          - { name: rsv, bits: [31, 1], width: 31, access: ro, desc: "保留" }
          - { name: bp_set, bits: [0, 0], width: 1, access: rw, type: cfg, desc: "强制本地MAU反压前级模块" }

      fw_dbg_bp_ign:
        offset: 0x1968
        width: 32
        fields:
          - { name: rsv, bits: [31, 4], width: 28, access: ro, desc: "保留" }
          - { name: bp_ign, bits: [3, 0], width: 4, access: rw, type: cfg, desc: "忽略反压本级MAU；[0]apl [1]后级 [2]LPM [3]本地ENGINE" }

  # --- FIFO / Credit 门限 ---
  fifo_thres:
    title: FIFO 将满门限与 Credit 门限
    note: "threshold 默认值以 fifo2.jpg 可见行为准"
    registers:

      fw_fifo_full_threshold:
        offset: 0x196c
        width: 32
        count: 10
        step: 0x4
        desc: "fifo 将满水线；默认值见 defaults"
        defaults: [0xc, 0x4, 0x4, 0x1c, 0x1c, 0x26, 0x6, 0x1e, 0x24, 0x24]
        fields:
          - { name: rsv, bits: [31, 7], width: 25, access: ro, desc: "保留" }
          - { name: threshold, bits: [6, 0], width: 7, access: rw, type: cfg, desc: "fifo 将满水线" }

      fw_credit_thres:
        offset: 0x1994
        width: 32
        desc: "credit max 门限打包"
        fields:
          - { name: threshold5, bits: [31, 28], width: 4, access: rw, type: cfg, reset: 0x3, desc: "credit threshold5" }
          - { name: threshold4, bits: [27, 24], width: 4, access: rw, type: cfg, reset: 0x8, desc: "credit threshold4" }
          - { name: threshold3, bits: [23, 18], width: 6, access: rw, type: cfg, reset: 0x2a, desc: "credit threshold3" }
          - { name: threshold2, bits: [17, 12], width: 6, access: rw, type: cfg, reset: 0x26, desc: "credit threshold2" }
          - { name: threshold1, bits: [11, 6], width: 6, access: rw, type: cfg, reset: 0x2e, desc: "credit threshold1" }
          - { name: threshold0, bits: [5, 0], width: 6, access: rw, type: cfg, reset: 0x23, desc: "credit threshold0" }
